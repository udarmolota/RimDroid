name: Build Unity Mono ARM64 spike

on:
  push:
    branches:
      - codex/mono-arm64-spike
    paths:
      - .github/workflows/mono-arm64-spike.yml
      - box64
      - box64/**
      - tools/mono-arm64/**
  workflow_dispatch:
    inputs:
      mono_commit:
        description: Unity Mono commit to build
        required: true
        default: c11bc9adba5d9dcad976d64b295bca8424fa41cd
      ndk_version:
        description: Android NDK package version
        required: true
        default: 19.2.5345600

permissions:
  contents: read

env:
  MONO_COMMIT: ${{ inputs.mono_commit || 'c11bc9adba5d9dcad976d64b295bca8424fa41cd' }}
  NDK_VERSION: ${{ inputs.ndk_version || '19.2.5345600' }}

jobs:
  build-box64-probe:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout RimDroid spike and Box64
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build x86_64 probe guest
        run: |
          set -euo pipefail
          chmod +x tools/mono-arm64/box64-probe/build-x86.sh
          tools/mono-arm64/box64-probe/build-x86.sh "$RUNNER_TEMP/box64-probe"
          readelf -h "$RUNNER_TEMP/box64-probe/mono_box64_probe" | grep -q 'Machine:.*X86-64'

      - name: Set up JDK 17 for sdkmanager
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up .NET 8 for thunk generation
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install NDK and build ARM64 Box64 with the Mono probe wrapper
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          sdkmanager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null || true
          "$sdkmanager" "ndk;27.0.12077973" "cmake;3.22.1"
          dotnet run --project tools/mono-arm64/icall-thunk-gen/IcallThunkGen.csproj -- \
            tools/mono-arm64/icall-thunk-gen/testdata/representative.tsv \
            "$RUNNER_TEMP/rd-mono-icalls.generated.c"
          "$sdk_root/ndk/27.0.12077973/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" \
            --target=aarch64-linux-android21 \
            -I tools/mono-arm64/icall-thunk-gen/testdata \
            -Wall -Wextra -Werror -Wno-unused-function -Wno-unused-variable \
            -c "$RUNNER_TEMP/rd-mono-icalls.generated.c" \
            -o "$RUNNER_TEMP/rd-mono-icalls.generated.o"
          cmake -S box64 -B "$RUNNER_TEMP/box64-arm64" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$sdk_root/ndk/27.0.12077973/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-30 \
            -DNOGIT=ON \
            -DARM_DYNAREC=ON
          cmake --build "$RUNNER_TEMP/box64-arm64" --target box64 --parallel 2
          readelf -h "$RUNNER_TEMP/box64-arm64/box64" | grep -q 'Machine:.*AArch64'

      - name: Upload P1 test executables
        uses: actions/upload-artifact@v4
        with:
          name: box64-mono-p1-${{ github.sha }}
          path: |
            ${{ runner.temp }}/box64-arm64/box64
            ${{ runner.temp }}/box64-probe/mono_box64_probe
          if-no-files-found: error
          retention-days: 14

  build-runtime:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout RimDroid spike
        uses: actions/checkout@v4

      - name: Install host build tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y autoconf automake gettext libtool make mono-devel texinfo

      - name: Set up JDK 17 for sdkmanager
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android NDK
        run: |
          set -euo pipefail
          sdkmanager "ndk;$NDK_VERSION"
          echo "MONO_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Checkout matching Unity Mono source
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout \
            https://github.com/Unity-Technologies/mono.git "$RUNNER_TEMP/unity-mono"
          git -C "$RUNNER_TEMP/unity-mono" checkout --detach "$MONO_COMMIT"
          git -C "$RUNNER_TEMP/unity-mono" submodule update --init --depth 1 external/bdwgc

      - name: Build Unity Mono for Android ARM64
        env:
          ANDROID_API: 21
        run: |
          set -euo pipefail
          chmod +x tools/mono-arm64/build-unity-mono-arm64.sh
          tools/mono-arm64/build-unity-mono-arm64.sh \
            "$RUNNER_TEMP/unity-mono" \
            "$MONO_NDK_ROOT" \
            "$RUNNER_TEMP/mono-arm64"

      - name: Build native ARM64 probe
        env:
          ANDROID_API: 21
        run: |
          set -euo pipefail
          chmod +x tools/mono-arm64/native-probe/build.sh
          tools/mono-arm64/native-probe/build.sh \
            "$MONO_NDK_ROOT" \
            "$RUNNER_TEMP/mono-arm64"

      - name: Verify artifact architecture and Unity API
        run: |
          set -euo pipefail
          runtime="$RUNNER_TEMP/mono-arm64/libmonobdwgc-2.0.so"
          readelf -h "$runtime" | grep -q 'Class:.*ELF64'
          readelf -h "$runtime" | grep -q 'Machine:.*AArch64'
          LC_ALL=C sort -c tools/mono-arm64/baseline-required-exports.txt
          test "$(wc -l < tools/mono-arm64/baseline-required-exports.txt)" -eq 289
          readelf --dyn-syms --wide "$runtime" |
            awk '$7 != "UND" && $8 ~ /^(mono_|unity_)/ { sub(/@.*/, "", $8); print $8 }' |
            LC_ALL=C sort -u > "$RUNNER_TEMP/candidate-exports.txt"
          comm -23 \
            tools/mono-arm64/baseline-required-exports.txt \
            "$RUNNER_TEMP/candidate-exports.txt" > "$RUNNER_TEMP/missing-exports.txt"
          if [[ -s "$RUNNER_TEMP/missing-exports.txt" ]]; then
            echo "Missing required UnityPlayer Mono exports:"
            cat "$RUNNER_TEMP/missing-exports.txt"
            exit 1
          fi
          readelf -h "$runtime"
          readelf -d "$runtime" | grep NEEDED || true
          cat "$RUNNER_TEMP/mono-arm64/build-manifest.txt"
          cat "$RUNNER_TEMP/mono-arm64/SHA256SUMS"

      - name: Pack research artifact
        run: |
          set -euo pipefail
          tar -C "$RUNNER_TEMP/mono-arm64" -czf unity-mono-arm64-spike.tar.gz .

      - name: Upload runtime and probe
        uses: actions/upload-artifact@v4
        with:
          name: unity-mono-arm64-${{ env.MONO_COMMIT }}
          path: unity-mono-arm64-spike.tar.gz
          if-no-files-found: error
          retention-days: 14
