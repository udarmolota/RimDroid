plugins {
    id 'com.android.application'
}

// RimWorld 1.7 on .NET (experimental): see fetchDotnetRuntime.
def dotnetEngineEnabled = (project.findProperty("dotnetEngine") ?: {
    def f = rootProject.file("local.properties")
    if (!f.isFile()) return null
    def p = new Properties(); f.withInputStream { p.load(it) }; return p.getProperty("dotnetEngine")
}()) == "true"

android {
    namespace 'com.rimdroid'
    compileSdk 36
    // Pin the exact NDK the working build used; r27 supports 16 KB page size when
    // opted in via ANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES below (Android 15+ requirement).
    ndkVersion "27.0.12077973"

    defaultConfig {
        applicationId "com.rimdroid"
        minSdk = 30
        targetSdk = 35
        versionCode 46
        versionName "0.3.0v3-test9"
        // JavaSteam + protobuf + kotlin push us past the 64K method limit. minSdk 30 has
        // native multidex, but the build still needs this flag to split the dex.
        multiDexEnabled true

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
                // ANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON => link with
                // -Wl,-z,max-page-size=16384 so our libs load on 16 KB-page devices.
                arguments "-DANDROID_STL=c++_shared",
                          "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
            }
        }
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    buildFeatures {
        viewBinding true
        buildConfig true   // expose BuildConfig.VERSION_NAME/CODE (used in the launch-config log)
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Test-cycle convenience: debug-signed release so adb install -r replaces the
            // debug build without wiping app data. Real distribution re-signs anyway.
            signingConfig signingConfigs.debug
        }
        debug {
            jniDebuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            // versionName above is the single source of truth for local and CI filenames.
            outputFileName = "rimdroid-${variant.buildType.name}-${variant.versionName}.apk"
        }
    }

    // Harmony rides in the built-in mod (see fetchHarmony below), fetched at build time: no
    // binary in the repository. With dotnetEngine=true the .NET runtime for RimWorld 1.7 rides along
    // the same way (fetchDotnetRuntime).
    sourceSets {
        main {
            assets.srcDirs += "$buildDir/harmony/assets"
            if (dotnetEngineEnabled) {
                assets.srcDirs += "$buildDir/dotnet/assets"
                assets.srcDirs += "src/dotnet/assets"   // RimDroidClrHooks.dll (tools/rimworld17/build_clrhooks.sh)
                jniLibs.srcDirs += "$buildDir/dotnet/jniLibs"
            }
        }
    }
}

// RimWorld 1.7 on .NET (experimental): the official .NET 10 runtime for Android (CoreCLR,
// Microsoft.NETCore.App.Runtime.android-arm64, MIT) from NuGet, pinned by hash. Only with
// dotnetEngine=true (Gradle property, ORG_GRADLE_PROJECT_dotnetEngine on CI, or local.properties);
// ordinary builds stay as they were. Native runtime libraries → jniLibs, framework assemblies → assets.
def dotnetVersion = "10.0.12"
def dotnetSha256 = "7f67905e5e5324e0c2b03920b62a3b09c036737ba84f9e7cb61f7e058d285ad3"
def dotnetDir = new File(buildDir, "dotnet")
tasks.register("fetchDotnetRuntime") {
    def nupkg = new File(dotnetDir, "microsoft.netcore.app.runtime.android-arm64.${dotnetVersion}.nupkg")
    def stamp = new File(dotnetDir, "extracted-${dotnetVersion}")
    outputs.file(stamp)
    onlyIf { dotnetEngineEnabled }
    doLast {
        if (!nupkg.isFile()) {
            nupkg.parentFile.mkdirs()
            new URL("https://api.nuget.org/v3-flatcontainer/microsoft.netcore.app.runtime.android-arm64/${dotnetVersion}/microsoft.netcore.app.runtime.android-arm64.${dotnetVersion}.nupkg")
                    .withInputStream { i -> nupkg.withOutputStream { o -> o << i } }
        }
        def md = java.security.MessageDigest.getInstance("SHA-256")
        nupkg.withInputStream { i -> byte[] b = new byte[1 << 16]; int n; while ((n = i.read(b)) > 0) md.update(b, 0, n) }
        def digest = md.digest().collect { String.format("%02x", it) }.join()
        if (digest != dotnetSha256) {
            nupkg.delete()
            throw new GradleException(".NET runtime ${dotnetVersion}: unexpected package hash ${digest}")
        }
        def libs = new File(dotnetDir, "jniLibs/arm64-v8a"), fw = new File(dotnetDir, "assets/dotnet/framework")
        project.delete(libs, fw)
        libs.mkdirs(); fw.mkdirs(); new File(dotnetDir, "libs").mkdirs()
        def zip = new java.util.zip.ZipFile(nupkg)
        try {
            zip.entries().each { e ->
                def name = e.name.substring(e.name.lastIndexOf('/') + 1)
                File target = null
                if (e.name.startsWith("runtimes/android-arm64/native/") && name.endsWith(".so")
                        && !name.startsWith("libmscordaccore") && !name.startsWith("libmscordbi"))
                    target = new File(libs, name)
                else if (e.name.startsWith("runtimes/android-arm64/lib/net10.0/") && name.endsWith(".dll"))
                    target = new File(fw, name)
                else if (e.name.startsWith("runtimes/android-arm64/native/") && name.endsWith(".jar"))
                    target = new File(dotnetDir, "libs/" + name)   // Java side of .NET's Android crypto
                if (target != null) zip.getInputStream(e).withStream { i -> target.withOutputStream { o -> o << i } }
            }
        } finally {
            zip.close()
        }
        stamp.text = dotnetVersion
    }
}
preBuild.dependsOn fetchDotnetRuntime

// Lib.Harmony (MIT, Andreas Pardeike) from NuGet, pinned by hash: 0Harmony.dll goes into the
// built-in mod's Assemblies, so every player of the native engine has Harmony for RimDroid's
// own patches (list scrolling, DDS textures) whether or not they use mods. Same copy every mod
// ships; the game loads the first one it meets.
def harmonyVersion = "2.4.1"
def harmonySha256 = "ff0183a1f27167f3543a0e095b4930a96c833ce783453e85a1e8a8ed33cd2f6d"
def harmonyDir = new File(buildDir, "harmony")
tasks.register("fetchHarmony") {
    def nupkg = new File(harmonyDir, "lib.harmony.${harmonyVersion}.nupkg")
    def dll = new File(harmonyDir, "assets/builtinmods/RimDroidControllerUI/Assemblies/0Harmony.dll")
    outputs.file(dll)
    doLast {
        if (!nupkg.isFile()) {
            nupkg.parentFile.mkdirs()
            new URL("https://api.nuget.org/v3-flatcontainer/lib.harmony/${harmonyVersion}/lib.harmony.${harmonyVersion}.nupkg")
                    .withInputStream { i -> nupkg.withOutputStream { o -> o << i } }
        }
        def digest = java.security.MessageDigest.getInstance("SHA-256").digest(nupkg.bytes)
                .collect { String.format("%02x", it) }.join()
        if (digest != harmonySha256) {
            nupkg.delete()
            throw new GradleException("Lib.Harmony ${harmonyVersion}: unexpected package hash ${digest}")
        }
        dll.parentFile.mkdirs()
        def zip = new java.util.zip.ZipFile(nupkg)
        try {
            def entry = zip.getEntry("lib/net472/0Harmony.dll")
            zip.getInputStream(entry).withStream { i -> dll.withOutputStream { o -> o << i } }
        } finally {
            zip.close()
        }
    }
}
preBuild.dependsOn fetchHarmony

dependencies {
    // Native Unity player (experimental, ":unity" process). Present only when the build asks for it
    // (nativeEngine=true) and unity/prepared exists, see settings.gradle.kts.
    if (rootProject.findProject(':unity') != null) {
        implementation project(':unity')
    }
    // RimWorld 1.7 on .NET: the Java classes .NET's Android crypto library looks up from JNI_OnLoad
    // (net.dot.android.crypto.*), from the same runtime pack (fetchDotnetRuntime).
    if (dotnetEngineEnabled) {
        implementation files("$buildDir/dotnet/libs/libSystem.Security.Cryptography.Native.Android.jar")
    }

    testImplementation 'junit:junit:4.13.2'

    // FMOD Android Java classes (org.fmod.AudioDevice / FMOD / MediaCodec). Required on the classpath
    // so the bundled native libfmod.so's JNI_OnLoad can FindClass("org/fmod/AudioDevice") — without it
    // System.load(libfmod) aborts with ClassNotFoundException. Used by the offline FSB5 audio decoder
    // (FmodDecodeService, ":fmoddec" process). From the shared Zomdroid FMOD bundle.
    implementation files('libs/fmod.jar')

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.activity:activity:1.8.2'
    implementation 'androidx.fragment:fragment:1.6.2'
    implementation 'androidx.navigation:navigation-fragment:2.7.6'
    implementation 'androidx.navigation:navigation-ui:2.7.6'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.core:core:1.12.0'
    implementation 'org.apache.commons:commons-compress:1.26.1'
    implementation 'commons-io:commons-io:2.15.1'   // required by commons-compress 1.26.x at runtime
    implementation 'org.tukaani:xz:1.11'   // VZipUtil (LZMAInputStream); 1.11 = version JavaSteam 1.8.0 was built against
    implementation 'com.google.code.gson:gson:2.10.1'

    // --- In-app Steam downloader SPIKE (Milestone 0) — JavaSteam (MIT, SteamKit2 port) ---
    // Proves on-device QR/Steam-Mobile login + (later) depot download, no Termux/PC.
    // bcprov + protobuf-java are JavaSteam's "optional" deps the consumer must add at the
    // versions JavaSteam 1.8.0 was built against (gradle/libs.versions.toml). xz (1.9) is
    // already above; zstd-jni is only needed for the depot-download step (add later).
    implementation 'in.dragonbra:javasteam:1.8.0'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.83'      // crypto provider JavaSteam needs
    implementation 'com.google.protobuf:protobuf-java:4.31.1'  // must match JavaSteam's protobuf

    // --- Milestone 1: depot download (DepotDownloader high-level API) ---
    // Separate Maven artifact in 1.8.0. Transitively pulls ktor-client-cio (pure-Kotlin/nio HTTP
    // engine used for CDN chunk downloads — Android-compatible) + kotlinx-serialization + okio.
    // The downloader is Android-aware: it REQUIRES an absolute installDirectory (else throws) and
    // writes its .DepotDownloader/staging under it, never to the process CWD.
    implementation 'in.dragonbra:javasteam-depotdownloader:1.8.0'
    // VZstdUtil decompresses zstd-compressed depot chunks via com.github.luben.zstd (native .so).
    // The @aar variant bundles jni/arm64-v8a/libzstd-jni-*.so — the desktop .jar has no Android natives.
    implementation 'com.github.luben:zstd-jni:1.5.7-6@aar'
}
