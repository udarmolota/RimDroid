plugins {
    id 'com.android.application'
}

android {
    namespace 'com.rimdroid'
    compileSdk 35
    // Pin the exact NDK the working build used; r27 supports 16 KB page size when
    // opted in via ANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES below (Android 15+ requirement).
    ndkVersion "27.0.12077973"

    defaultConfig {
        applicationId "com.rimdroid"
        minSdk = 30
        targetSdk = 35
        versionCode 14
        versionName "0.1.4"

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
                // ANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON => link with
                // -Wl,-z,max-page-size=16384 so our libs load on 16 KB-page devices.
                arguments "-DANDROID_STL=c++_shared",
                          "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
            }
        }
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    buildFeatures {
        viewBinding true
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            jniDebuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "rimdroid-${variant.buildType.name}.apk"
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.activity:activity:1.8.2'
    implementation 'androidx.fragment:fragment:1.6.2'
    implementation 'androidx.navigation:navigation-fragment:2.7.6'
    implementation 'androidx.navigation:navigation-ui:2.7.6'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.core:core:1.12.0'
    implementation 'org.apache.commons:commons-compress:1.26.1'
    implementation 'org.tukaani:xz:1.9'
    implementation 'com.google.code.gson:gson:2.10.1'
}
